<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>

<body>
    <form action="">
        <h1>registeration form</h1>

        <!-- working on name -->
        <label for="fname">First Name</label> <br>
        <input type="text" placeholder="enter your first name" required> <br> <br>

        <label for="lname">Last Name</label> <br>
        <input type="text" placeholder="enter your last name" required><br> <br>

        <!-- working on email -->
        <label for="email">Email</label> <br>
        <input type="email" placeholder="jonny@gmail.com" required> <br> <br>

        <!-- working on phone number -->
        <label for="pnumb">Phone Number</label> <br>
        <input type="number" placeholder="enter your phone number" required> <br> <br>

        <!-- workiong on password -->
        <label for="pwd">Password</label> <br>
        <input type="password" placeholder="enter password" required> <br> <br>

        <label for="confirmpwd">Confirm Password</label> <br>
        <input type="password" placeholder="confirm password" required> <br> <br>

        <!-- working on gender -->
        <label for="gender">Gender:</label> <br>
        <label for="male">Male</label>
        <input type="radio" name="gender">

        <label for="female">Female</label>
        <input type="radio" name="gender"> <br><br>

        <!-- working on Hobbies -->
        <label><strong>Hobbies</strong></label> <br>
        <input type="checkbox">
        <label for="reading">Reading</label> <br>

        <input type="checkbox">
        <label for="sports">Sports</label> <br>

        <input type="checkbox">
        <label for="music">Music</label> <br>

        <input type="checkbox">
        <label for="gaming">Gaming</label> <br>

        <input type="checkbox">
        <label for="coding">Coding</label> <br> <br>

        <!-- working on country -->
        <label><strong>Country</strong></label> <br>
        <select>
            <option value="nigeria">Nigeria</option>
            <option value="togo">Togo</option>
            <option value="senegal">Senegal</option>
            <option value="egypt">Egypt</option>
            <option value="england">England</option>
            <option value="spain">Spain</option>
            <option value="germany">Germany</option>
            <option value="italy">Italy</option>
            <option value="usa">USA</option>
            <option value="china">China</option>
            <option value="other">Other</option>
        </select> <br><br>

        <!-- working on date of birth -->
         <label for="dob">Date of Birth</label> <br>
         <input type="date"> <br><br>

         <!-- working on button -->
          <input type="submit">
          <input type="reset">
    </form> 
</body>

</html>
